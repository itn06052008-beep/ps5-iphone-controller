name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    paths: ["ios/**"]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build (no signing)
        working-directory: ios
        run: |
          xcodebuild -project PS5Pad.xcodeproj -scheme PS5Pad -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PS5Pad.app Payload/
          zip -qr PS5Pad-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PS5Pad-unsigned-ipa
          path: ios/PS5Pad-unsigned.ipa
